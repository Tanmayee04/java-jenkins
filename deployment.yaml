apiVersion: apps/v1
kind: Deployment
metadata: 
  name: java-app
spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: java-app1
  template: 
    metadata: 
      labels: 
        app: java-app1
    spec: 
      containers:
        - name: java-cont
          image: tanmayeedhakate/java-jenkins
